name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.compiler }}, ASan + UBSan)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev
      - name: Configure
        env:
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DVNSL_SANITIZE=ON -DVNSL_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Unit tests and real-capture tests
        run: ctest --test-dir build --output-on-failure

  crosscheck:
    name: Real truck traffic (cross-check against can-j1939, physical consistency)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build vn-decode
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVNSL_BUILD_TESTS=OFF
          cmake --build build --target vn-decode
      - name: Decode the capture
        run: |
          set -o pipefail
          ./build/vn-decode testdata/turku-truck-2020-11-26-slice.csv > ours.jsonl
          ./build/vn-decode --summary testdata/turku-truck-2020-11-26-slice.csv | tail -4
      - name: Compare every message with the independent can-j1939 package
        run: |
          set -o pipefail
          pip install can-j1939==2.0.12 python-can==4.6.1
          python3 tools/crosscheck_j1939.py testdata/turku-truck-2020-11-26-slice.csv ours.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the truck's clock and message rates against facts the decoder cannot know
        run: |
          set -o pipefail
          python3 tools/check_consistency.py ours.jsonl --markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: candump conversion round-trips
        run: |
          ./build/vn-decode --candump testdata/turku-truck-2020-11-26-slice.csv > capture.log
          ./build/vn-decode --format candump capture.log | cmp - ours.jsonl

  simulation:
    name: Simulated truck (determinism, can-j1939 incl. RTS/CTS, physics)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVNSL_BUILD_TESTS=OFF
          cmake --build build --target vn-sim vn-decode
      - name: Ten simulated minutes, twice with the same seed (must be identical)
        run: |
          set -o pipefail
          ./build/vn-sim --duration 600 --seed 1 --conflict --summary --out sim.log 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          ./build/vn-sim --duration 600 --seed 1 --conflict --out sim2.log
          cmp sim.log sim2.log
          ./build/vn-decode --summary sim.log | tail -3 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare every message, connection-mode transfers included, with can-j1939
        run: |
          set -o pipefail
          pip install can-j1939==2.0.12 python-can==4.6.1
          ./build/vn-decode sim.log > sim.jsonl
          python3 tools/crosscheck_j1939.py sim.log sim.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the simulated traffic is physically consistent
        run: |
          set -o pipefail
          python3 tools/check_sim_physics.py sim.jsonl --markdown | tee -a "$GITHUB_STEP_SUMMARY"

  vcan:
    name: Live on a Linux virtual CAN bus (vcan), checked with can-utils
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install can-utils and the vcan kernel module
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build can-utils
          # vcan ships in linux-modules-extra on some runner kernels; install it only if needed.
          sudo modprobe vcan || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe vcan; }
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0
          ip -details link show vcan0
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVNSL_BUILD_TESTS=OFF
          cmake --build build --target vn-sim vn-record vn-replay vn-decode
      - name: Live run carries exactly the frames of the offline simulation
        run: |
          set -o pipefail
          ./build/vn-sim --duration 20 --seed 7 --out offline.log
          candump -L vcan0 > candump.log &
          CD=$!
          ./build/vn-record vcan0 > record.log &
          VR=$!
          sleep 1
          ./build/vn-sim --iface vcan0 --duration 20 --seed 7 --out live.log --summary
          sleep 1
          kill -TERM $CD $VR
          wait $CD $VR || true
          python3 tools/compare_logs.py offline.log live.log candump.log record.log | tee -a "$GITHUB_STEP_SUMMARY"
      - name: A request injected from outside is answered by the simulated engine
        run: |
          set -o pipefail
          candump -L vcan0 > candump2.log &
          CD=$!
          sleep 1
          ./build/vn-sim --iface vcan0 --duration 12 --seed 7 --out live2.log &
          SIM=$!
          sleep 6
          cansend vcan0 18EAFFF1#ECFE00   # global request (from 0xF1) for the vehicle ID, PGN 65260
          wait $SIM
          sleep 1
          kill -TERM $CD
          wait $CD || true
          # The engine must answer with a broadcast (BAM) of the 18-byte vehicle ID.
          python3 tools/compare_logs.py live2.log candump2.log --external 18EAFFF1#ECFE00 \
            --require-frame 1CECFF00#20120003FFECFE00 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Replaying the log at 4x reproduces it
        run: |
          set -o pipefail
          candump -L vcan0 > replay.log &
          CD=$!
          sleep 1
          ./build/vn-replay live.log vcan0 --speed 4
          sleep 1
          kill -TERM $CD
          wait $CD || true
          python3 tools/compare_logs.py live.log replay.log --speed 4 | tee -a "$GITHUB_STEP_SUMMARY"

  ids:
    name: "Intrusion detection (simulated attacks: detection and false alarms)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVNSL_BUILD_TESTS=OFF
          cmake --build build --target vn-sim vn-ids vn-attack
      - name: Five minutes of simulated traffic
        run: ./build/vn-sim --duration 300 --seed 3 --out sim.log
      - name: Clean traffic raises only a few novelty alerts (none from an attack)
        run: |
          set -o pipefail
          ./build/vn-ids sim.log --train-frac 0.4 2>&1 >/dev/null | tee ids.out | tee -a "$GITHUB_STEP_SUMMARY"
          # Learned ranges yield a handful of novelty alerts when a later drive cycle exceeds the
          # training window; assert the count stays small (a blow-up would mean a regression).
          n=$(grep -oE "[0-9]+ alerts" ids.out | grep -oE "[0-9]+")
          echo "clean alerts: $n"
          test "$n" -lt 100
      - name: Every attack must be detected with no false alarms outside its window
        run: |
          set -o pipefail
          for atk in flood spoof replay jump hijack; do
            ./build/vn-attack sim.log --attack "$atk" --start 200 --duration 20 --out "a_$atk.log" --labels "a_$atk.labels"
            python3 tools/evaluate_ids.py ./build/vn-ids "a_$atk.log" "a_$atk.labels" --train-frac 0.4 --markdown | tee -a "$GITHUB_STEP_SUMMARY"
          done

  secoc:
    name: Message authentication (crypto vectors, protect/verify, attacks rejected)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVNSL_BUILD_TESTS=OFF
          cmake --build build --target vn-sim vn-secoc vn-attack vn-mac
      - name: Cross-check SHA-256 and HMAC against Python hashlib
        run: python3 tools/crosscheck_crypto.py ./build/vn-mac 3000 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Protect two safety PGNs on simulated traffic; genuine must all verify
        run: |
          set -o pipefail
          ./build/vn-sim --duration 120 --seed 5 --out clean.log
          ./build/vn-secoc protect clean.log --pgn 65265 --pgn 61441 --out prot.log
          ./build/vn-secoc verify prot.log --pgn 65265 --pgn 61441 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: A spoof and a replay against the protected log must be rejected
        run: |
          set -o pipefail
          ./build/vn-attack prot.log --attack spoof  --start 60 --duration 20 --out spoof.log
          ./build/vn-attack prot.log --attack replay --start 60 --duration 20 --out replay.log
          # verify exits nonzero when anything is rejected, so invert: the attack MUST be caught.
          ! ./build/vn-secoc verify spoof.log  --pgn 65265 --pgn 61441 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          ! ./build/vn-secoc verify replay.log --pgn 65265 --pgn 61441 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  gateway:
    name: "Hardened gateway (default-deny filtering, live vcan, nftables + SELinux policy)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install can-utils, nftables, SELinux policy tools, vcan
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build can-utils nftables checkpolicy
          sudo modprobe vcan || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe vcan; }
          for d in vcan0 vcan1; do sudo ip link add dev $d type vcan; sudo ip link set up $d; done
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVNSL_BUILD_TESTS=OFF
          cmake --build build --target vn-sim vn-gateway
      - name: The nftables host ruleset is valid
        run: sudo nft -c -f deploy/nftables.conf && echo "nftables ruleset OK" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The SELinux policy module compiles
        run: |
          checkmodule -M -m -o /tmp/vn_gateway.mod deploy/selinux/vn_gateway.te
          echo "SELinux policy compiles" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Default-deny filtering, live on two virtual CAN buses
        run: |
          set -o pipefail
          ./build/vn-sim --duration 20 --seed 9 --out expected.log
          candump -L vcan1 > out.log &
          CD=$!
          ./build/vn-gateway live --in vcan0 --out vcan1 --policy deploy/gateway.policy --direction B>A --duration 25 &
          GW=$!
          sleep 1
          ./build/vn-sim --iface vcan0 --duration 20 --seed 9 >/dev/null
          # An attacker on the diagnostic side tries to push a command onto the powertrain bus.
          cansend vcan0 0C0000F9#0102030405060708
          sleep 2
          kill -TERM $CD $GW 2>/dev/null; wait $GW 2>/dev/null || true; wait $CD 2>/dev/null || true
          python3 tools/check_gateway.py out.log deploy/gateway.policy | tee -a "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Fuzz (libFuzzer, 7 targets, 60 s each)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev
      - name: Build fuzzers
        env:
          CXX: clang++
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DVNSL_BUILD_TESTS=OFF -DVNSL_BUILD_FUZZERS=ON
          cmake --build build --target fuzz_log_line fuzz_transport fuzz_signals fuzz_truck fuzz_ids fuzz_secoc fuzz_gateway
      - name: Fuzz the candump and CSV line parsers, seeded with real rows
        run: |
          mkdir -p corpus-log && head -n 300 testdata/turku-truck-2020-11-26-slice.csv | split -l 1 - corpus-log/csv-
          printf '(1606390200.265340) can0 0CFE6CE6#FFFFFFFFFFFFFFFF' > corpus-log/candump
          ./build/fuzz_log_line -max_total_time=60 -max_len=4096 corpus-log
      - name: Fuzz the transport-protocol reassembler with arbitrary frame sequences
        run: |
          mkdir -p corpus-tp
          python3 tools/make_tp_seeds.py corpus-tp
          ./build/fuzz_transport -max_total_time=60 -max_len=4096 corpus-tp
      - name: Fuzz the signal, DM1, Time/Date and NAME decoders
        run: |
          mkdir -p corpus-sig
          printf '\xd2\x1c\x09\x0b\x66\x23\xff\xff' > corpus-sig/td
          ./build/fuzz_signals -max_total_time=60 -max_len=2048 corpus-sig
      - name: Fuzz the simulated truck's active J1939 stack with injected frames
        run: |
          mkdir -p corpus-truck
          python3 tools/make_truck_seeds.py corpus-truck
          ./build/fuzz_truck -max_total_time=60 -max_len=2200 -rss_limit_mb=4096 corpus-truck
      - name: Fuzz the intrusion detector (train then judge on arbitrary frames)
        run: |
          mkdir -p corpus-ids
          printf '\x0a\x18\xfe\xf1\x00\x08\x01\x02\x03\x04\x05\x06\x07' > corpus-ids/seed
          ./build/fuzz_ids -max_total_time=60 -max_len=4096 corpus-ids
      - name: Fuzz the SecOC verifier (must never accept a guessed tag)
        run: |
          mkdir -p corpus-secoc
          printf '\x17\x08AAAAAAAA\x00\x11\x22\x33\x44' > corpus-secoc/seed
          ./build/fuzz_secoc -max_total_time=60 -max_len=512 corpus-secoc
      - name: Fuzz the gateway policy parser and forwarding decision
        run: |
          mkdir -p corpus-gw
          printf 'B>A pgn=65265 rate=12\n' > corpus-gw/seed
          ./build/fuzz_gateway -max_total_time=60 -max_len=512 corpus-gw

  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy
      - name: Configure
        env:
          CXX: clang++
        run: cmake -S . -B build -G Ninja -DVNSL_BUILD_TESTS=OFF
      - name: clang-tidy
        run: run-clang-tidy -p build -quiet -warnings-as-errors='*' 'src/|apps/'
