#!/usr/sbin/nft -f
# Host firewall for the CAN gateway appliance: default-deny on every IP chain. The gateway's
# job is on the CAN buses, not the IP network, so the host accepts only loopback and the
# packets of connections it started itself, and drops everything else inbound and forwarded.
# Validated in CI with `nft -c -f deploy/nftables.conf`.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        # No listening services on this appliance; nothing else is accepted.
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
        # This host does not route IP traffic; CAN forwarding is done by vn-gateway, not the kernel.
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
